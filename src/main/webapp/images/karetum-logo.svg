<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad2)" stroke="url(#grad1)" stroke-width="2"/>
  
  <!-- Diagram nodes -->
  <!-- Node 1 - Start -->
  <rect x="15" y="20" width="20" height="12" rx="6" fill="url(#grad1)"/>
  
  <!-- Node 2 - Process -->
  <rect x="55" y="20" width="30" height="12" rx="2" fill="url(#grad1)"/>
  
  <!-- Node 3 - Decision -->
  <polygon points="50,45 65,55 50,65 35,55" fill="url(#grad1)"/>
  
  <!-- Node 4 - End -->
  <rect x="15" y="70" width="20" height="12" rx="6" fill="url(#grad1)"/>
  
  <!-- Connections -->
  <path d="M35 26 L55 26" stroke="#00d9ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M50 32 L50 45" stroke="#00d9ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M35 55 L25 55 L25 70" stroke="#00d9ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M65 55 L75 55 L75 45 L55 45" stroke="#00d9ff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d9ff"/>
    </marker>
  </defs>
  
  <!-- AI sparkle -->
  <g transform="translate(75, 75)">
    <circle cx="0" cy="0" r="3" fill="#00d9ff"/>
    <circle cx="-6" cy="-6" r="2" fill="#00d9ff" opacity="0.7"/>
    <circle cx="6" cy="-6" r="2" fill="#00d9ff" opacity="0.7"/>
    <circle cx="-6" cy="6" r="2" fill="#00d9ff" opacity="0.7"/>
    <circle cx="6" cy="6" r="2" fill="#00d9ff" opacity="0.7"/>
  </g>
</svg>
